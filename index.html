<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picasso Shoes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='43' font-family='serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EPS%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#111;--ph:#000;--pd:#000;--pl:#f1f1f1;--gt:rgba(255,255,255,.58);--gb:rgba(255,255,255,.55);--ring:rgba(0,0,0,.25);--bg:#f6f6f4;--tx:#161616;--mu:#777}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh;transition:background-color .5s}
body::before{content:"";position:fixed;inset:-20% -20% auto auto;width:70vw;height:70vw;max-width:600px;max-height:600px;border-radius:50%;background:var(--pl);filter:blur(80px);opacity:.8;z-index:-1;transition:background-color .6s}
button,input,select,textarea{font:inherit;color:inherit}
.glass{background:var(--gt);backdrop-filter:blur(20px) saturate(145%);-webkit-backdrop-filter:blur(20px) saturate(145%);border:1px solid var(--gb);box-shadow:0 8px 32px rgba(0,0,0,.06);transition:background-color .5s,border-color .5s}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(255,255,255,.92)}}
.wrap{max-width:1100px;margin:auto;padding:0 14px}
header{position:sticky;top:0;z-index:20;margin:10px 10px 0;border-radius:22px;padding:8px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);font-family:Georgia,serif;font-weight:700;letter-spacing:2px;font-size:13px;white-space:nowrap}
.logo svg{width:34px;height:34px}
.search{flex:1;min-width:0;border:1px solid var(--gb);background:rgba(255,255,255,.6);border-radius:16px;padding:8px 12px;outline:none}
.search:focus,input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--ring)}
.ib{border:0;background:none;font-size:22px;cursor:pointer;position:relative;padding:4px}
.bd{position:absolute;top:-4px;left:-4px;background:var(--p);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;transition:background-color .4s}
.hero{margin:14px 0;border-radius:24px;padding:34px 22px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;transition:background .5s}
.hero h1{font-size:clamp(24px,6vw,42px);font-weight:800}.hero p{opacity:.8;margin-top:6px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.pill,.chip{border:1px solid var(--gb);background:var(--gt);border-radius:99px;padding:7px 16px;cursor:pointer;white-space:nowrap;transition:.3s}
.pill.on,.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.fl{border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.fl select{border:1px solid var(--gb);background:rgba(255,255,255,.7);border-radius:12px;padding:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.card{border-radius:22px;overflow:hidden;cursor:pointer;transition:transform .3s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.card .in{padding:10px 12px 12px}.card h3{font-size:14px}.pr{color:var(--p);font-weight:800;transition:color .4s}
.sz{font-size:11px;color:var(--mu);margin-top:4px}
.pd{display:grid;gap:18px;margin-top:14px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.main{width:100%;border-radius:24px;aspect-ratio:1;object-fit:cover;background:#eee}
.th{display:flex;gap:8px;margin-top:8px}.th img{width:64px;height:64px;border-radius:14px;object-fit:cover;cursor:pointer;border:2px solid transparent}.th img.on{border-color:var(--p)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bbb;cursor:pointer;transition:.3s}
.sw.on{box-shadow:0 0 0 3px var(--p)}
.chip{min-width:46px;text-align:center}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.btn{border:0;border-radius:18px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;transition:background-color .4s,transform .15s}
.btn:hover{background:var(--ph)}.btn:active{transform:scale(.97);background:var(--pd)}
.btn.g{background:var(--gt);color:var(--tx);border:1px solid var(--gb)}
.bar{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;border-radius:22px;padding:10px;display:flex;gap:8px}
.bar .btn{flex:1}
footer{position:fixed;left:0;right:0;bottom:0;z-index:16;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;border-radius:22px 22px 0 0}
footer a{flex:1;max-width:160px;text-align:center;text-decoration:none;color:var(--tx);font-size:12px;font-weight:600;padding:8px 2px;border-radius:14px;background:rgba(255,255,255,.6)}
.ci{display:flex;gap:10px;border-radius:20px;padding:10px;margin-bottom:10px;align-items:center}
.ci img{width:76px;height:76px;border-radius:14px;object-fit:cover}.ci .f{flex:1;min-width:0}
.q{display:flex;gap:8px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--gb);background:var(--gt);cursor:pointer}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:14px;z-index:99;font-size:14}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #0001;text-align:right}
.adm input,.adm select,.adm textarea{width:100%;border:1px solid #0002;border-radius:12px;padding:9px;margin:4px 0 10px;background:#fff9;outline:none}
.box{border-radius:22px;padding:16px;margin-bottom:14px}
.mod{position:fixed;inset:0;background:#0006;z-index:50;overflow:auto;padding:14px}
h2{margin:10px 0}.mu{color:var(--mu);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<footer class="glass" id="ft"></footer>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('المساحة ممتلئة')}}};
const CFG=window.PS_CONFIG;
const rest=(p,o={},t)=>fetch(CFG.url+'/rest/v1/'+p,{...o,headers:{apikey:CFG.key,Authorization:'Bearer '+(t||CFG.key),'Content-Type':'application/json',...(o.headers||{})}}).then(async r=>{if(!r.ok)throw new Error(await r.text());const x=await r.text();return x?JSON.parse(x):null});
const C=[{n:'أسود',h:'#1a1a1a'},{n:'أبيض',h:'#e9e9e9'},{n:'أزرق',h:'#1d4ed8'},{n:'أخضر',h:'#15803d'},{n:'أحمر',h:'#b91c1c'},{n:'بني',h:'#78350f'}];
let P=[],S={phone:'',fb:'',tt:'',map:''};
async function load(){const[a,b]=await Promise.all([rest('products?select=id,data,request_count&order=id'),rest('store_settings?id=eq.1&select=data')]);P=a.map(r=>({...r.data,id:r.id,rc:r.request_count||0}));if(b&&b[0])S=b[0].data}
let cart=LS.g('ps_cart',[]),F={q:'',size:'',color:'',cat:''},sel={},adm=false,ai=0;
const saveCart=()=>LS.s('ps_cart',cart);let TK='';
const shoe=h=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#efeeea"/><ellipse cx="200" cy="330" rx="150" ry="14" fill="#0001"/><path d="M60 270c0-50 20-100 40-130l60 10c20 40 60 55 110 60 40 5 70 20 70 50v20H60z" fill="${h}"/><path d="M60 290h290v20c0 10-8 18-20 18H80c-12 0-20-8-20-18z" fill="#fff" stroke="#0002"/><path d="M165 150l25-35 25 45" fill="none" stroke="#fff6" stroke-width="6"/></svg>`);
const img=(p,i=0)=>p.images[i]||(i==0?shoe(p.colors[0]?.h||'#222'):shoe(p.colors[i%p.colors.length]?.h||'#222'));
/* adaptive theme */
const tcache={};
function pal(hex){if(tcache[hex])return tcache[hex];let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2,d=mx-mn;if(d){s=d/(1-Math.abs(2*l-1));h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h=Math.round(h*60);if(h<0)h+=360}
s=Math.round(s*100);const L=Math.min(Math.max(l*100,28),45),c=x=>`hsl(${h} ${s}% ${x}%)`;
return tcache[hex]={'--p':c(L),'--ph':c(L-6),'--pd':c(L-16),'--pl':`hsl(${h} ${Math.min(s,70)}% 92%)`,'--gt':`hsl(${h} ${Math.min(s,60)}% 98% / .6)`,'--gb':`hsl(${h} 40% 100% / .6)`,'--ring':`hsl(${h} ${s}% ${L}% / .35)`,'--bg':`hsl(${h} ${Math.min(s,40)}% 96%)`}}
function theme(hex){const n={'--p':'#111','--ph':'#000','--pd':'#000','--pl':'#f1f1f1','--gt':'rgba(255,255,255,.58)','--gb':'rgba(255,255,255,.55)','--ring':'rgba(0,0,0,.25)','--bg':'#f6f6f4'};const v=hex?pal(hex):n;for(const k in v)document.documentElement.style.setProperty(k,v[k])}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2000)}
const money=n=>Number(n).toLocaleString('ar-EG')+' جنيه';
const logoSvg='<svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#111"/><text x="32" y="43" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">PS</text></svg>';
function foot(){$('#ft').className='glass';$('#ft').innerHTML=`<a href="https://wa.me/${esc(S.phone)}" target="_blank">واتساب</a><a href="${esc(S.fb)}" target="_blank">فيسبوك</a><a href="${esc(S.tt)}" target="_blank">تيك توك</a><a href="${esc(S.map.startsWith('http')?S.map:'https://maps.google.com/?q='+S.map)}" target="_blank">الموقع</a>`}
function head(){const n=cart.reduce((a,c)=>a+c.qty,0);return`<header class="glass"><a class="logo" href="#/">${logoSvg}<span>PICASSO SHOES</span></a><input class="search" id="q" placeholder="ابحث عن حذاء..." value="${esc(F.q)}"><a class="ib" href="#/cart">🛍️${n?`<span class="bd">${n}</span>`:''}</a></header>`}
function visible(){return P.filter(p=>(!F.q||p.name.includes(F.q))&&(!F.cat||p.cat==F.cat)&&(!F.size||p.sizes.includes(+F.size))&&(!F.color||p.colors.some(c=>c.n==F.color)))}
function gridHtml(){const v=visible();return v.length?v.map(p=>`<div class="card glass" onclick="location.hash='#/p/${p.id}'"><img loading="lazy" src="${img(p)}" alt=""><div class="in"><h3>${esc(p.name)}</h3><div class="pr">${money(p.price)}</div><div class="sz">المقاسات: ${p.sizes.join('، ')}</div></div></div>`).join(''):'<p class="mu">لا توجد نتائج</p>'}
function home(){theme(null);$('#app').innerHTML=head()+`<div class="wrap"><div class="hero"><h1>أناقة تمشي معك</h1><p>تشكيلة فاخرة من الأحذية بتصاميم عصرية</p></div>
<div class="pills">${['','رجالي','نسائي','رياضي'].map(c=>`<button class="pill ${F.cat==c?'on':''}" data-c="${c}">${c||'الكل'}</button>`).join('')}</div>
<div class="fl glass"><select id="fs"><option value="">المقاس</option>${[...Array(10)].map((_,i)=>`<option ${F.size==35+i?'selected':''}>${35+i}</option>`).join('')}</select>
<select id="fc"><option value="">اللون</option>${C.map(c=>`<option ${F.color==c.n?'selected':''}>${c.n}</option>`).join('')}</select></div>
<div class="grid" id="grid">${gridHtml()}</div></div>`;
bindHead();document.querySelectorAll('.pill').forEach(b=>b.onclick=()=>{F.cat=b.dataset.c;home()});
$('#fs').onchange=e=>{F.size=e.target.value;$('#grid').innerHTML=gridHtml()};$('#fc').onchange=e=>{F.color=e.target.value;$('#grid').innerHTML=gridHtml()}}
function bindHead(){const q=$('#q');if(q)q.oninput=e=>{F.q=e.target.value;if(location.hash.startsWith('#/p')||location.hash.startsWith('#/cart')){location.hash='#/'}else if($('#grid'))$('#grid').innerHTML=gridHtml()}}
function prod(id){const p=P.find(x=>x.id==id);if(!p)return home();if(sel.id!=id)sel={id,size:'',color:'',img:0};
theme(sel.color||p.colors[0]?.h);
$('#app').innerHTML=head()+`<div class="wrap"><div class="pd"><div><img class="main" src="${img(p,sel.img)}" alt=""><div class="th">${[0,1,2,3].filter(i=>p.images[i]||i==0).map(i=>`<img class="${sel.img==i?'on':''}" src="${img(p,i)}" onclick="sel.img=${i};prod('${id}')">`).join('')}</div></div>
<div><h2>${esc(p.name)}</h2><div class="pr" style="font-size:24px">${money(p.price)}</div><p class="mu" style="margin:10px 0">${esc(p.desc)}</p>
<b>المقاس</b><div class="row">${p.sizes.map(s=>`<button class="chip ${sel.size==s?'on':''}" onclick="sel.size=${s};prod('${id}')">${s}</button>`).join('')}</div>
<b>اللون ${sel.color?'':''}</b><div class="row">${p.colors.map(c=>`<div class="sw ${sel.color==c.h?'on':''}" title="${esc(c.n)}" style="background:${c.h}" onclick="sel.color='${c.h}';prod('${id}')"></div>`).join('')}</div>
<p class="mu">${p.stock<5?'⚠️ الكمية محدودة':'متوفر'}</p></div></div></div>
<div class="bar glass"><button class="btn" id="a1">إضافة للسلة</button><button class="btn g" id="a2">طلب عبر واتساب مباشر</button></div>`;
bindHead();const ok=()=>{if(!sel.size||!sel.color){toast('اختر المقاس واللون أولاً');return null}return p.colors.find(c=>c.h==sel.color)};
$('#a1').onclick=()=>{const c=ok();if(!c)return;const k=id+sel.size+c.n,ex=cart.find(x=>x.k==k);ex?ex.qty++:cart.push({k,id,name:p.name,size:sel.size,color:c.n,qty:1,price:p.price});saveCart();location.hash='#/cart'};
$('#a2').onclick=()=>{const c=ok();if(!c)return;p.rc++;rest('rpc/bump',{method:'POST',body:JSON.stringify({pid:p.id,n:1})}).catch(()=>{});wa(`مرحبا Picasso Shoes 👟\nاريد طلب هذا المنتج:\n📦 المنتج: ${p.name}\n👟 المقاس: ${sel.size}\n🎨 اللون: ${c.n}\n💰 السعر: ${money(p.price)}\n🖼️ صورة المنتج: ${imgUrl(p)}`)}}
const wa=t=>window.open(`https://wa.me/${S.phone}?text=${encodeURIComponent(t)}`,'_blank');
const imgUrl=p=>p.images[0]&&p.images[0].startsWith('http')?p.images[0]:location.href.split('#')[0]+'#/p/'+p.id;
function cartPg(){theme(null);const tot=cart.reduce((a,c)=>a+c.qty*c.price,0);
$('#app').innerHTML=head()+`<div class="wrap"><h2>سلة التسوق</h2>${cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id==c.id);return`<div class="ci glass"><img src="${p?img(p):''}"><div class="f"><b>${esc(c.name)}</b><div class="mu">مقاس ${c.size} · ${esc(c.color)}</div><div class="pr">${money(c.price*c.qty)}</div></div><div class="q"><button onclick="qty(${i},1)">+</button>${c.qty}<button onclick="qty(${i},-1)">−</button></div></div>`}).join('')+`<div class="box glass"><b>المجموع الكلي: ${money(tot)}</b></div><button class="btn" style="width:100%" id="ck">تأكيد الطلب عبر واتساب</button>`:'<p class="mu">السلة فارغة</p><a class="btn" style="display:inline-block;margin-top:10px;text-decoration:none" href="#/">تصفح المنتجات</a>'}</div>`;
bindHead();const b=$('#ck');if(b)b.onclick=()=>{let m='طلب جديد من Picasso Shoes 👟\n\n';cart.forEach((c,i)=>{const p=P.find(x=>x.id==c.id);if(p){p.rc+=c.qty;rest('rpc/bump',{method:'POST',body:JSON.stringify({pid:p.id,n:c.qty})}).catch(()=>{})}m+=`${i+1}- ${c.name} - مقاس ${c.size} - لون ${c.color} - ${money(c.price)} × ${c.qty}\n🖼️ ${p?imgUrl(p):''}\n`});m+=`\nالمجموع الكلي: ${tot} جنيه\n------------------`;wa(m)}}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);saveCart();cartPg()}
function route(){const h=location.hash||'#/';window.scrollTo(0,0);const m=h.match(/^#\/p\/(.+)/);if(m)prod(m[1]);else if(h.startsWith('#/cart'))cartPg();else home();if(!h.startsWith('#/p/'))sel={}}
window.addEventListener('hashchange',route);load().then(()=>{foot();route()}).catch(()=>{$('#app').innerHTML='<p style="padding:40px;text-align:center">تعذّر الاتصال بالخادم</p>'});
</script>
</body>
</html>
